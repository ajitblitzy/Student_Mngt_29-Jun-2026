[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society_mgmt"
version = "1.0.0"
description = "Consolidated Python migration of the society_mgmt corpus exposing a single canonical compute(x)."
readme = {text = "society_mgmt: a single canonical compute(x) with a thin nine-layer taxonomy (config, controllers, domain, middleware, models, repositories, routes, services, utils).", content-type = "text/markdown"}
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE/LICENSE.txt"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
